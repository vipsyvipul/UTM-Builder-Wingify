<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>UTM Builder · Wingify</title>
<meta name="description" content="Build consistent UTM links for Wingify webinars, ebooks, field events and podcasts.">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="band">
  <nav class="nav" aria-label="Main">
    <a class="brand" href="#builder">
      <img src="https://static.wingify.com/gcp/wp-content/plugins/vwo-common-templates/images/wingify/logo-wingify.svg" alt="Wingify">
      <span>UTM Builder</span>
    </a>
    <div class="tabs">
      <a href="#builder" data-tab="builder">Builder</a>
      <a href="#matrix" data-tab="matrix">Matrix</a>
    </div>
  </nav>
</div>

<aside class="side" id="side" aria-label="Campaign settings">
  <form class="sheet" id="form" autocomplete="off">
    <section class="step">
      <h2 class="step-title" id="type-label"><span class="step-num">1</span>Content Type</h2>
      <p class="step-sub">(Virtual events count as webinars)</p>
      <div class="field">
        <div class="choice radio" role="radiogroup" aria-labelledby="type-label" id="type"></div>
      </div>
      <div class="field">
        <span class="field-label" id="stage-label">Funnel stage</span>
        <div class="choice radio" role="radiogroup" aria-labelledby="stage-label" id="stage"></div>
      </div>
    </section>

    <section class="step">
      <h2 class="step-title"><span class="step-num">2</span>URLs and Salesforce ID</h2>
      <div class="field">
        <label class="field-label" for="long">Permalink</label>
        <input type="url" id="long" placeholder="https://wingify.com/webinars/…">
      </div>
      <div class="field-row">
        <div class="field">
          <label class="field-label" for="short">Short URL <span class="opt">(optional)</span></label>
          <input type="url" id="short" placeholder="https://wingify.com/s/123456/">
        </div>
        <div class="field">
          <label class="field-label" for="sfid">Salesforce Campaign ID</label>
          <input type="text" id="sfid" class="mono" placeholder="701…" spellcheck="false">
        </div>
      </div>
    </section>

    <section class="step">
      <h2 class="step-title"><span class="step-num">3</span>Channels</h2>
      <div id="channels"></div>
    </section>

    <div class="step">
      <button type="button" class="btn btn-small" id="clear">Clear form</button>
    </div>
  </form>
</aside>
<div class="dim" id="dim"></div>
<button type="button" class="fab" id="fab" aria-controls="side" aria-expanded="false"><span class="off"><i class="fa-solid fa-sliders" aria-hidden="true"></i> Edit settings</span><span class="on">Done</span></button>

<div class="inset">
<main>
  <div class="builder" id="tab-builder">
    <div class="results">
      <section class="anatomy" aria-label="utm_campaign preview">
        <div class="anatomy-head">
          <h2 class="anatomy-title"><code>utm_campaign</code></h2>
        </div>
        <div class="segments" id="segments"></div>
        <p class="anatomy-id" id="anatomy-id"></p>
      </section>
      <section class="panel" id="output" aria-live="polite"></section>
    </div>
  </div>

  <div class="matrix" id="tab-matrix" hidden></div>
</main>

<footer><a href="https://github.com/vipsyvipul/UTM-Builder-Wingify" target="_blank" rel="noopener">Source code</a>
</footer>
</div>

<script src="app.js"></script>
</body>
</html>
