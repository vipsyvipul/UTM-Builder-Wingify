<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UTM Builder</title>
<style>
  :root {
    --bg: #f6f7f9;
    --card: #ffffff;
    --text: #1a1d23;
    --muted: #5f6672;
    --border: #dde1e7;
    --accent: #2f5bd3;
    --accent-text: #ffffff;
    --error-bg: #fdecec;
    --error-text: #9b1c1c;
    --code-bg: #f1f3f6;
    --ok: #1d7a46;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #14161a;
      --card: #1d2026;
      --text: #e8eaee;
      --muted: #9aa1ad;
      --border: #333842;
      --accent: #6d8ff0;
      --accent-text: #0e1117;
      --error-bg: #3a1d1f;
      --error-text: #f2a9a9;
      --code-bg: #262a31;
      --ok: #5fcf8f;
    }
  }
  :root[data-theme="dark"] {
    --bg: #14161a;
    --card: #1d2026;
    --text: #e8eaee;
    --muted: #9aa1ad;
    --border: #333842;
    --accent: #6d8ff0;
    --accent-text: #0e1117;
    --error-bg: #3a1d1f;
    --error-text: #f2a9a9;
    --code-bg: #262a31;
    --ok: #5fcf8f;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  main {
    max-width: 1180px;
    margin: 0 auto;
    padding: 24px 16px 48px;
  }
  header { margin-bottom: 16px; }
  .builder {
    display: grid;
    grid-template-columns: minmax(0, 420px) minmax(0, 1fr);
    gap: 24px;
    align-items: start;
  }
  .tabs { display: flex; gap: 4px; margin-top: 14px; border-bottom: 1px solid var(--border); }
  .tabs a {
    padding: 8px 14px;
    color: var(--muted);
    text-decoration: none;
    border-bottom: 2px solid transparent;
    margin-bottom: -1px;
    font-weight: 600;
  }
  .tabs a[aria-current="page"] { color: var(--text); border-bottom-color: var(--accent); }
  [hidden] { display: none !important; }
  .matrix .card { margin-bottom: 16px; }
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--border); vertical-align: top; }
  th { color: var(--muted); font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: .04em; }
  td code, .rules code {
    font-family: ui-monospace, Menlo, monospace;
    font-size: 12.5px;
    background: var(--code-bg);
    padding: 1px 5px;
    border-radius: 4px;
  }
  td.group { font-weight: 600; background: var(--code-bg); }
  .rules { margin: 0; padding-left: 20px; }
  .rules li { margin-bottom: 4px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  h2 { font-size: 16px; margin: 0 0 12px; }
  .sub { color: var(--muted); margin: 0; }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 20px;
  }
  .field { margin-bottom: 18px; }
  .field > label, .field > .label {
    display: block;
    font-weight: 600;
    margin-bottom: 6px;
  }
  .hint { color: var(--muted); font-size: 13px; margin: 4px 0 0; }
  input[type="text"], input[type="url"], select {
    width: 100%;
    padding: 9px 10px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--card);
    color: var(--text);
    font: inherit;
  }
  input:focus, select:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  fieldset { border: 0; margin: 0 0 10px; padding: 0; }
  legend { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin-bottom: 4px; }
  .checks { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px 12px; }
  .check { display: flex; gap: 8px; align-items: center; }
  .extra { grid-column: 1 / -1; display: none; gap: 8px; margin: 2px 0 6px 26px; }
  .extra.show { display: flex; }
  .extra input, .extra select { width: auto; flex: 1; min-width: 0; }
  .errors {
    background: var(--error-bg);
    color: var(--error-text);
    border-radius: 6px;
    padding: 10px 14px;
    margin: 0;
  }
  .errors li { margin-left: 16px; }
  .summary { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; margin: 0 0 16px; font-size: 14px; }
  .summary dt { color: var(--muted); }
  .summary dd { margin: 0; font-family: ui-monospace, Menlo, monospace; word-break: break-all; }
  .toolbar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
  button {
    font: inherit;
    font-size: 14px;
    padding: 7px 12px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--text);
    cursor: pointer;
    white-space: nowrap;
  }
  button.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
  button.copied { color: var(--ok); border-color: var(--ok); }
  .group-title { font-weight: 600; margin: 18px 0 8px; }
  .link {
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    margin-bottom: 8px;
  }
  .link-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
  .link-label { font-weight: 600; font-size: 14px; }
  .link-actions { display: flex; gap: 6px; }
  .link code {
    display: block;
    margin-top: 6px;
    padding: 6px 8px;
    background: var(--code-bg);
    border-radius: 4px;
    font-size: 12.5px;
    word-break: break-all;
  }
  .note { color: var(--muted); font-size: 13px; margin: 0 0 16px; }
  .empty { color: var(--muted); }
  @media (max-width: 820px) {
    .builder { grid-template-columns: minmax(0, 1fr); }
  }
</style>
</head>
<body>
<main>
  <header>
    <h1>UTM Builder</h1>
    <p class="sub">Fill in the form. Links appear on the right, ready to copy.</p>
    <nav class="tabs">
      <a href="#builder" data-tab="builder">Builder</a>
      <a href="#matrix" data-tab="matrix">Matrix</a>
    </nav>
  </header>

  <div class="builder" id="tab-builder">
  <form class="card" id="form" autocomplete="off">
    <div class="field">
      <label for="type">1. Content type</label>
      <select id="type"></select>
    </div>

    <div class="field">
      <label for="stage">2. Funnel stage</label>
      <select id="stage"></select>
    </div>

    <div class="field">
      <label for="name">3. Content name</label>
      <input type="text" id="name" placeholder="Discover the new Wingify platform">
      <p class="hint">Used as the heading. The campaign value comes from the permalink slug.</p>
    </div>

    <div class="field">
      <span class="label">4. Channels</span>
      <div id="channels"></div>
    </div>

    <div class="field">
      <label for="long">5. Permalink (long URL)</label>
      <input type="url" id="long" placeholder="https://wingify.com/webinars/...">
    </div>

    <div class="field">
      <label for="short">6. Short URL <span class="hint">(optional)</span></label>
      <input type="url" id="short" placeholder="Short URL from WordPress">
    </div>

    <div class="field">
      <label for="sfid">7. Salesforce Campaign ID</label>
      <input type="text" id="sfid" placeholder="701MI000016cpgkYAA">
      <p class="hint">15 or 18 characters, starts with 701.</p>
    </div>
  </form>

  <section class="card" id="output" aria-live="polite"></section>
  </div>

  <div class="matrix" id="tab-matrix" hidden></div>
</main>

<script>
// ---- Taxonomy (edit here) ----
const ALLOWED_DOMAINS = ['wingify.com'];

const FUNNEL_STAGES = [
  { code: 'tof', label: 'Top of funnel' },
  { code: 'mof', label: 'Middle of funnel' },
  { code: 'bof', label: 'Bottom of funnel' },
];

const TYPES = [
  { code: 'wb', label: 'Webinar (incl. virtual event)' },
  { code: 'eb', label: 'Ebook' },
  { code: 'ev', label: 'Field event' },
  { code: 'pc', label: 'Podcast' },
];

// utm_content values for marketing email, by content type
const EMAIL_CONTENTS = {
  wb: ['invite', 'reminder', 'last-chance', 'recording'],
  ev: ['invite', 'reminder', 'last-chance'],
  eb: ['launch', 'follow-up'],
  pc: ['launch', 'follow-up'],
};

const OTHER_MEDIUMS = ['social', 'paid-social', 'email', 'partner', 'community'];

// contents: 'social' | 'email' | array of fixed values ([] = no utm_content)
// input: free-text source the user must type (partner name, community name...)
const CHANNEL_GROUPS = [
  { group: 'Social', items: [
    { id: 'linkedin', label: 'LinkedIn', source: 'linkedin', medium: 'social', contents: 'social' },
    { id: 'x', label: 'X', source: 'x', medium: 'social', contents: 'social' },
    { id: 'facebook', label: 'Facebook', source: 'facebook', medium: 'social', contents: 'social' },
    { id: 'instagram', label: 'Instagram', source: 'instagram', medium: 'social', contents: 'social' },
    { id: 'youtube', label: 'YouTube', source: 'youtube', medium: 'social', contents: 'social' },
    { id: 'linkedin-ads', label: 'LinkedIn Ads', source: 'linkedin', medium: 'paid-social', contents: ['ad'] },
  ]},
  { group: 'Email', items: [
    { id: 'marketing', label: 'Marketing email', source: 'marketing', medium: 'email', contents: 'email' },
    { id: 'newsletter', label: 'Newsletter', source: 'newsletter', medium: 'email', contents: [] },
    { id: 'sdr', label: 'SDR email', source: 'sdr', medium: 'email', contents: [] },
    { id: 'ae', label: 'AE email', source: 'ae', medium: 'email', contents: [] },
    { id: 'cs', label: 'CS email', source: 'cs', medium: 'email', contents: [] },
  ]},
  { group: 'Other', items: [
    { id: 'partner', label: 'Partner', medium: 'partner', contents: [], input: 'Partner name' },
    { id: 'community', label: 'Community', medium: 'community', contents: [], input: 'Community name' },
    { id: 'other', label: 'Other', medium: null, contents: [], input: 'Source name' },
  ]},
];

// ---- Pure logic ----
function slugify(s) {
  return String(s || '')
    .normalize('NFD').replace(/[̀-ͯ]/g, '')
    .toLowerCase()
    .replace(/[^a-z0-9]+/g, '-')
    .replace(/^-+|-+$/g, '');
}

// Salesforce 15 -> 18 char ID: each 5-char chunk encodes which chars are uppercase
function toId18(id15) {
  const map = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ012345';
  let suffix = '';
  for (let i = 0; i < 3; i++) {
    let flags = 0;
    for (let j = 0; j < 5; j++) {
      const c = id15.charAt(i * 5 + j);
      if (c >= 'A' && c <= 'Z') flags += 1 << j;
    }
    suffix += map.charAt(flags);
  }
  return id15 + suffix;
}

function parseSfId(raw) {
  const id = String(raw || '').trim();
  if (!id) return { error: 'Add the Salesforce Campaign ID.' };
  if (!/^[a-zA-Z0-9]+$/.test(id) || (id.length !== 15 && id.length !== 18)) {
    return { error: 'Salesforce Campaign ID must be 15 or 18 letters/numbers.' };
  }
  if (!id.startsWith('701')) return { error: 'Salesforce Campaign ID must start with 701 (that prefix means Campaign).' };
  const id18 = toId18(id.slice(0, 15));
  if (id.length === 18 && id18.slice(15) !== id.slice(15).toUpperCase()) {
    return { error: 'Salesforce Campaign ID looks mistyped: the last 3 characters do not match. Copy it again from Salesforce.' };
  }
  return { id18 };
}

function parseUrl(raw) {
  try {
    const u = new URL(String(raw || '').trim());
    return /^https?:$/.test(u.protocol) ? u : null;
  } catch (e) {
    return null;
  }
}

function isAllowedHost(host) {
  return ALLOWED_DOMAINS.some(d => host === d || host.endsWith('.' + d));
}

function slugFromPermalink(u) {
  const parts = u.pathname.split('/').filter(Boolean);
  const last = parts.length ? parts[parts.length - 1].replace(/\.(php|html?)$/, '') : '';
  return last === 'index' ? '' : slugify(decodeURIComponent(last));
}

function contentsFor(item, type) {
  if (item.contents === 'social') {
    return ['company', 'employee'].concat(type === 'wb' || type === 'pc' ? ['speaker'] : []);
  }
  if (item.contents === 'email') return EMAIL_CONTENTS[type];
  return item.contents;
}

function withUtms(baseUrl, params) {
  const u = new URL(baseUrl.href);
  for (const [k, v] of params) u.searchParams.set(k, v);
  return u.href;
}

// state: { type, name, long, short, sfid, channels: { [id]: { on, source, medium } } }
function build(state) {
  const errors = [];
  const typeCode = state.type;
  if (!FUNNEL_STAGES.some(f => f.code === state.stage)) errors.push('Pick a funnel stage.');

  const long = parseUrl(state.long);
  if (!String(state.long || '').trim()) errors.push('Add the permalink (long URL).');
  else if (!long) errors.push('Permalink is not a valid URL. It should start with https://');
  else if (!isAllowedHost(long.hostname)) errors.push('Permalink must be on ' + ALLOWED_DOMAINS.join(' or ') + '.');

  let short = null;
  if (String(state.short || '').trim()) {
    short = parseUrl(state.short);
    if (!short) errors.push('Short URL is not a valid URL. It should start with https://');
  }

  const sf = parseSfId(state.sfid);
  if (sf.error) errors.push(sf.error);

  const slug = (long && slugFromPermalink(long)) || slugify(state.name);
  if (long && !slug) errors.push('Permalink has no slug. Add a content name so the campaign value can be built from it.');

  const selected = [];
  for (const g of CHANNEL_GROUPS) {
    for (const item of g.items) {
      const ch = state.channels[item.id];
      if (!ch || !ch.on) continue;
      const source = item.input ? slugify(ch.source) : item.source;
      const medium = item.medium || ch.medium;
      if (!source) errors.push(item.label + ': add the ' + item.input.toLowerCase() + '.');
      if (!medium) errors.push(item.label + ': pick a medium.');
      selected.push({ group: g.group, item, source, medium });
    }
  }
  if (!selected.length) errors.push('Tick at least one channel.');

  if (errors.length) return { errors };

  const campaign = state.stage + '-' + typeCode + '_' + slug + '_' + sf.id18;
  const links = [];
  for (const s of selected) {
    const contents = contentsFor(s.item, typeCode);
    const variants = contents.length ? contents : [null];
    for (const content of variants) {
      const params = [['utm_source', s.source], ['utm_medium', s.medium], ['utm_campaign', campaign]];
      if (content) params.push(['utm_content', content]);
      params.push(['utm_id', sf.id18]);
      const label = s.item.input ? s.item.label + ' (' + s.source + ')' : s.item.label;
      links.push({
        group: s.group,
        label: content ? label + ' · ' + content : label,
        long: withUtms(long, params),
        short: short ? withUtms(short, params) : null,
      });
    }
  }
  return { errors: [], campaign, id18: sf.id18, links };
}

// ---- UI ----
if (typeof document !== 'undefined') {
  const $ = id => document.getElementById(id);

  $('type').innerHTML = TYPES.map(t => `<option value="${t.code}">${t.label}</option>`).join('');
  $('stage').innerHTML = '<option value="">Pick a stage…</option>' +
    FUNNEL_STAGES.map(f => `<option value="${f.code}">${f.label}</option>`).join('');

  $('channels').innerHTML = CHANNEL_GROUPS.map(g => `
    <fieldset>
      <legend>${g.group}</legend>
      <div class="checks">
        ${g.items.map(item => `
          <label class="check"><input type="checkbox" data-ch="${item.id}"> ${item.label}</label>
          ${item.input ? `
            <div class="extra" data-extra="${item.id}">
              <input type="text" data-src="${item.id}" placeholder="${item.input}">
              ${item.medium ? '' : `<select data-med="${item.id}"><option value="">Medium…</option>${OTHER_MEDIUMS.map(m => `<option>${m}</option>`).join('')}</select>`}
            </div>` : ''}
        `).join('')}
      </div>
    </fieldset>`).join('');

  function readState() {
    const channels = {};
    for (const g of CHANNEL_GROUPS) {
      for (const item of g.items) {
        const box = document.querySelector(`[data-ch="${item.id}"]`);
        const src = document.querySelector(`[data-src="${item.id}"]`);
        const med = document.querySelector(`[data-med="${item.id}"]`);
        const extra = document.querySelector(`[data-extra="${item.id}"]`);
        if (extra) extra.classList.toggle('show', box.checked);
        channels[item.id] = { on: box.checked, source: src ? src.value : '', medium: med ? med.value : '' };
      }
    }
    return {
      type: $('type').value,
      stage: $('stage').value,
      name: $('name').value,
      long: $('long').value,
      short: $('short').value,
      sfid: $('sfid').value,
      channels,
    };
  }

  function esc(s) {
    return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  }

  function copy(text, btn) {
    const done = () => {
      const old = btn.textContent;
      btn.textContent = 'Copied';
      btn.classList.add('copied');
      setTimeout(() => { btn.textContent = old; btn.classList.remove('copied'); }, 1500);
    };
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(text).then(done);
    } else {
      const ta = document.createElement('textarea');
      ta.value = text;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      ta.remove();
      done();
    }
  }

  let current = null;

  function render() {
    const state = readState();
    const result = build(state);
    const out = $('output');
    const untouched = !state.long && !state.sfid && !Object.values(state.channels).some(c => c.on);

    if (untouched) {
      current = null;
      out.innerHTML = '<h2>Links</h2><p class="empty">Fill in the form to generate links.</p>';
      return;
    }
    if (result.errors.length) {
      current = null;
      out.innerHTML = '<h2>Links</h2><ul class="errors">' + result.errors.map(e => `<li>${esc(e)}</li>`).join('') + '</ul>';
      return;
    }

    current = result;
    const hasShort = result.links.some(l => l.short);
    let html = `<h2>${esc(state.name.trim() || 'Links')}</h2>
      <dl class="summary">
        <dt>utm_campaign</dt><dd>${esc(result.campaign)}</dd>
        <dt>utm_id</dt><dd>${esc(result.id18)}</dd>
      </dl>
      <div class="toolbar">
        <button type="button" class="primary" data-copy-all>Copy all (paste into Sheets)</button>
      </div>`;
    if (hasShort) {
      html += '<p class="note">Short links keep UTMs only if the redirect passes them on. Check once: open a short link and confirm the address bar still shows utm_source.</p>';
    }
    let lastGroup = null;
    result.links.forEach((l, i) => {
      if (l.group !== lastGroup) {
        html += `<div class="group-title">${esc(l.group)}</div>`;
        lastGroup = l.group;
      }
      html += `<div class="link">
        <div class="link-head">
          <span class="link-label">${esc(l.label)}</span>
          <span class="link-actions">
            <button type="button" data-copy="${i}" data-kind="long">Copy</button>
            ${l.short ? `<button type="button" data-copy="${i}" data-kind="short">Copy short</button>` : ''}
          </span>
        </div>
        <code>${esc(l.long)}</code>
      </div>`;
    });
    out.innerHTML = html;
  }

  // ---- Matrix tab (built from the same taxonomy as the builder) ----
  function contentsText(item) {
    if (item.contents === 'social') return '<code>company</code>, <code>employee</code>, <code>speaker</code> (webinar and podcast only)';
    if (item.contents === 'email') return 'Depends on content type (see Content types)';
    return item.contents.length ? item.contents.map(c => `<code>${c}</code>`).join(', ') : '—';
  }

  function renderMatrix() {
    const byMedium = new Map();
    for (const g of CHANNEL_GROUPS) {
      for (const item of g.items) {
        const key = item.medium || '';
        if (!byMedium.has(key)) byMedium.set(key, []);
        byMedium.get(key).push(item);
      }
    }
    let channelRows = '';
    for (const [medium, items] of byMedium) {
      const mediumCell = medium
        ? `<code>${medium}</code>`
        : 'Picked from: ' + OTHER_MEDIUMS.map(m => `<code>${m}</code>`).join(', ');
      channelRows += `<tr><td class="group" colspan="3">${mediumCell}</td></tr>`;
      for (const item of items) {
        const source = item.input ? `${item.input} as typed, formatted` : `<code>${item.source}</code>`;
        channelRows += `<tr><td>${source}</td><td>${item.label}</td><td>${contentsText(item)}</td></tr>`;
      }
    }

    const typeRows = TYPES.map(t => `<tr>
      <td>${t.label}</td>
      <td><code>${t.code}</code></td>
      <td>${EMAIL_CONTENTS[t.code].map(c => `<code>${c}</code>`).join(', ')}</td>
      <td>${t.code === 'wb' || t.code === 'pc' ? 'Yes' : 'No'}</td>
    </tr>`).join('');

    $('tab-matrix').innerHTML = `
      <section class="card">
        <h2>How each UTM is built</h2>
        <div class="table-wrap"><table>
          <tr><th>Parameter</th><th>Answers</th><th>Value</th></tr>
          <tr><td><code>utm_source</code></td><td>Which platform or sender?</td><td>From the channel (see Channels)</td></tr>
          <tr><td><code>utm_medium</code></td><td>What kind of channel?</td><td>From the channel (see Channels)</td></tr>
          <tr><td><code>utm_campaign</code></td><td>Which content?</td><td><code>{stage}-{type}_{permalink slug}_{Salesforce Campaign ID}</code><br>e.g. <code>tof-wb_discover-the-new-wingify-platform_701MI000016cpgkYAA</code></td></tr>
          <tr><td><code>utm_content</code></td><td>Which post or email?</td><td>From the channel and content type</td></tr>
          <tr><td><code>utm_id</code></td><td>Which Salesforce campaign?</td><td>18-character Salesforce Campaign ID</td></tr>
          <tr><td><code>utm_term</code></td><td>—</td><td>Not used. Reserved for paid search keywords.</td></tr>
        </table></div>
      </section>

      <section class="card">
        <h2>Channels, grouped by utm_medium</h2>
        <div class="table-wrap"><table>
          <tr><th>utm_source</th><th>Channel checkbox</th><th>utm_content</th></tr>
          ${channelRows}
        </table></div>
      </section>

      <section class="card">
        <h2>Funnel stages</h2>
        <div class="table-wrap"><table>
          <tr><th>Stage</th><th>Code</th></tr>
          ${FUNNEL_STAGES.map(f => `<tr><td>${f.label}</td><td><code>${f.code}</code></td></tr>`).join('')}
        </table></div>
      </section>

      <section class="card">
        <h2>Content types</h2>
        <div class="table-wrap"><table>
          <tr><th>Type</th><th>Code</th><th>Marketing email utm_content</th><th>Social <code>speaker</code> link</th></tr>
          ${typeRows}
        </table></div>
      </section>

      <section class="card">
        <h2>Formatting rules</h2>
        <ul class="rules">
          <li>All values are lowercase. Spaces and special characters become <code>-</code>. Accents are removed (<code>Conversión</code> → <code>conversion</code>).</li>
          <li><code>_</code> separates the parts of <code>utm_campaign</code>. <code>-</code> joins words inside a part.</li>
          <li>The Salesforce Campaign ID keeps its original case. 15-character IDs are converted to 18.</li>
          <li>Permalinks must be on ${ALLOWED_DOMAINS.join(' or ')}.</li>
        </ul>
      </section>`;
  }

  function showTab() {
    const tab = location.hash === '#matrix' ? 'matrix' : 'builder';
    $('tab-builder').hidden = tab !== 'builder';
    $('tab-matrix').hidden = tab !== 'matrix';
    document.querySelectorAll('[data-tab]').forEach(a => {
      if (a.dataset.tab === tab) a.setAttribute('aria-current', 'page');
      else a.removeAttribute('aria-current');
    });
  }

  renderMatrix();
  showTab();
  window.addEventListener('hashchange', showTab);

  $('form').addEventListener('input', render);
  $('form').addEventListener('change', render);
  $('form').addEventListener('submit', e => e.preventDefault());

  $('output').addEventListener('click', e => {
    const btn = e.target.closest('button');
    if (!btn || !current) return;
    if (btn.hasAttribute('data-copy-all')) {
      const hasShort = current.links.some(l => l.short);
      const rows = [['Link', 'Long URL'].concat(hasShort ? ['Short URL'] : [])];
      for (const l of current.links) rows.push([l.label, l.long].concat(hasShort ? [l.short || ''] : []));
      copy(rows.map(r => r.join('\t')).join('\n'), btn);
      return;
    }
    const link = current.links[Number(btn.dataset.copy)];
    copy(btn.dataset.kind === 'short' ? link.short : link.long, btn);
  });

  render();
}
</script>
</body>
</html>
